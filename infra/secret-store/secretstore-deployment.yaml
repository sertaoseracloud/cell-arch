apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-secret-store
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: csi-secret-store
  template:
    metadata:
      labels:
        app: csi-secret-store
    spec:
      serviceAccountName: csi-secret-store-sa
      containers:
        - name: provider-aws
          image: k8s.gcr.io/csi/secrets-store-csi-driver-provider-aws:v1.0.0
          args:
            - --region
            - us-east-1
          env:
            - name: AWS_ROLE_ARN
              value: "arn:aws:iam::123456789012:role/sidecar-secret-access"
          volumeMounts:
            - name: mountpoint
              mountPath: /mnt/secrets-store
              readOnly: true
        - name: provider-azure
          image: mcr.microsoft.com/oss/kubernetes-csi/secrets-store/driver/csi-secrets-store-provider-azure:v1.0.0
          args:
            - --cloud
            - Azure
          env:
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-creds
                  key: tenant-id
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-creds
                  key: client-id
          volumeMounts:
            - name: mountpoint
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: mountpoint
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sidecar-secrets
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sidecar-secrets
  namespace: default
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: sidecar/aws-creds
        objectType: secretsmanager
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-sidecar-secrets
  namespace: default
spec:
  provider: azure
  parameters:
    keyvaultName: sidecar-kv
    objects: |
      array:
        - |
          objectName: sidecar-creds
          objectType: secret
